[mypy]
python_version = 3.13
ignore_missing_imports = True
show_error_codes = True
pretty = True
exclude = (?x)(^build/)
check_untyped_defs = True
warn_return_any = True
warn_unused_ignores = True
no_implicit_optional = True

[mypy-tests.*]
ignore_errors = True

# ctypes.WinDLL and ctypes.get_last_error exist only on Windows, and this
# module reaches for them behind a sys.platform guard. Checking runs on both
# Linux and Windows, so an inline ignore would be flagged as unused on one of
# them.
[mypy-core.secure_memory]
disable_error_code = attr-defined

[mypy-storage.db_channels]
disable_error_code = attr-defined

[mypy-storage.db_tasks]
disable_error_code = attr-defined

[mypy-storage.db_settings]
disable_error_code = attr-defined

[mypy-storage.db_comment_campaigns]
disable_error_code = attr-defined

[mypy-storage.db_join_campaigns]
disable_error_code = attr-defined

# Split implementation mixins intentionally receive attributes from their public
# facade classes at runtime. Keep strict checking elsewhere while allowing that
# established mixin pattern in these internal modules.
[mypy-gui.views.account_parts.*]
disable_error_code = attr-defined,arg-type,type-var,has-type,var-annotated,assignment,call-overload

[mypy-gui.views.commenting_parts.*]
disable_error_code = attr-defined,arg-type,type-var,has-type,var-annotated,assignment

# The public facades deliberately provide Optional/shared state consumed by the
# split mixins. Mypy cannot model that runtime MRO contract without duplicating
# the full QWidget surface in typing-only bases, so keep only the observed
# composition false positives disabled here.
[mypy-gui.views.account_view]
disable_error_code = misc,assignment

[mypy-gui.views.commenting_view]
disable_error_code = assignment

[mypy-storage.account_repository_parts.*]
disable_error_code = attr-defined

[mypy-storage.channel_repository_parts.*]
disable_error_code = attr-defined

[mypy-workers.queue_parts.*]
disable_error_code = attr-defined
