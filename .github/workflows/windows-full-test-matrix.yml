name: Windows CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Workflow contracts
    uses: ./.github/workflows/workflow-contracts.yml

  source-proof:
    needs: contracts
    if: ${{ always() && (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'dependabot/github_actions/')) }}
    name: Python ${{ matrix.python }} x64 full source proof
    runs-on: windows-2022
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.13"
          - "3.14"

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      QT_QPA_PLATFORM: "offscreen"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Configure byte-preserving Git checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.safecrlf true

      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }} x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-bootstrap.txt
            requirements-runtime.lock
            requirements-openai.lock
            requirements-dev-windows-x64.lock

      - name: Install complete hash-locked test environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m ensurepip --upgrade
          python -m pip install --require-hashes -r requirements-bootstrap.txt
          python -m pip install --require-hashes --no-build-isolation -r requirements-runtime.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-openai.lock
          python -m pip install --require-hashes -r requirements-dev-windows-x64.lock
          python -m pip check

      - name: Run every source, static and behavior gate
        id: source_proof
        shell: pwsh
        run: |
          $versionToken = "${{ matrix.python }}".Replace(".", "")
          $evidence = "dist\windows-ci\python-$versionToken"
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File ".\tools\run_windows_source_ci.ps1" `
            -PythonVersion "${{ matrix.python }}" `
            -EvidenceRoot $evidence
          exit $LASTEXITCODE

      - name: Add matrix summary
        if: always()
        shell: pwsh
        run: |
          $versionToken = "${{ matrix.python }}".Replace(".", "")
          $summaryPath = "dist\windows-ci\python-$versionToken\summary.json"
          if (Test-Path -LiteralPath $summaryPath -PathType Leaf) {
            $summary = Get-Content -LiteralPath $summaryPath -Raw | ConvertFrom-Json
            @"
          ## Windows Python ${{ matrix.python }} source proof

          - Commit: `${{ github.sha }}`
          - Passed: `$($summary.passed)`
          - Failed gates: `$(@($summary.failed) -join ', ')`
          - Runner: Windows Server 2022 x64
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          }
          else {
            "Windows Python ${{ matrix.python }} source proof produced no summary.json." |
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          }

      - name: Upload complete Windows source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LansetBot-Windows-Python-${{ matrix.python }}-${{ github.sha }}
          path: dist/windows-ci/**
          if-no-files-found: error
          retention-days: 14

  release-proof:
    name: Windows release proof
    needs:
      - contracts
      - source-proof
    if: ${{ always() && (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'dependabot/github_actions/')) }}
    uses: ./.github/workflows/windows-release-proof.yml
    with:
      skip_source_tests: true
      continue_after_failures: true
      upstream_source_proof_passed: ${{ needs.source-proof.result == 'success' }}
