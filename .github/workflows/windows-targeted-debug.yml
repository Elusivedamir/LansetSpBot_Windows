name: Windows v515 Process-Death Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-death-v515:
    name: Python ${{ matrix.python }} x64 — v515 only
    runs-on: windows-2022
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      QT_QPA_PLATFORM: "offscreen"

    steps:
      - name: Checkout exact audit ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python }} x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          architecture: "x64"
          cache: "pip"

      - name: Install hash-locked test environment
        shell: pwsh
        run: |
          python -m ensurepip --upgrade
          python -m pip install --require-hashes -r requirements-bootstrap.txt
          python -m pip install --require-hashes --no-build-isolation -r requirements-runtime.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-openai.lock
          python -m pip install --require-hashes -r requirements-dev-windows-x64.lock
          python -m pip check

      - name: Compile v515 only
        shell: pwsh
        run: |
          python -m py_compile tests/test_v515_process_death_fault_injection.py

      - name: Run v515 process-death scenarios only
        shell: pwsh
        run: |
          python -m pytest `
            tests/test_v515_process_death_fault_injection.py `
            -vv -s `
            -o addopts="" `
            --tb=long `
            --showlocals `
            --maxfail=0 `
            --junitxml=v515-results-${{ matrix.python }}.xml `
            2>&1 | Tee-Object -FilePath v515-${{ matrix.python }}.log

          exit $LASTEXITCODE

      - name: Upload v515 diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v515-process-death-python-${{ matrix.python }}-${{ github.sha }}
          path: |
            v515-${{ matrix.python }}.log
            v515-results-${{ matrix.python }}.xml
          if-no-files-found: error
