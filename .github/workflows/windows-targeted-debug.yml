name: Windows Targeted Debug

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.py"
      - ".github/workflows/windows-targeted-debug.yml"

permissions:
  contents: read

jobs:
  targeted-tests:
    runs-on: windows-2022
    timeout-minutes: 30

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      QT_QPA_PLATFORM: "offscreen"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"
          cache: "pip"

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-bootstrap.txt
          python -m pip install -r requirements-runtime.lock
          python -m pip install -r requirements-openai.lock
          python -m pip install -r requirements-dev-windows-x64.lock

      - name: Run failing tests with full traceback
        shell: pwsh
        run: |
          python -m pytest `
            tests/test_v27_local_ban_runtime_fix.py::test_ambiguous_join_bans_only_target_and_batch_continues `
            tests/test_v27_local_ban_runtime_fix.py::test_resumed_checkpoint_skips_already_banned_channel_without_rpc `
            tests/test_v4715_repeat_audit_fixes.py::test_queue_worker_stops_after_five_consecutive_processing_failures `
            -vv -s --tb=long --maxfail=3 `
            --junitxml=targeted-results.xml 2>&1 |
            Tee-Object -FilePath targeted-tests.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-targeted-debug-${{ github.sha }}
          path: |
            targeted-tests.log
            targeted-results.xml
          if-no-files-found: warn
