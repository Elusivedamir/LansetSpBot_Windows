name: Windows Targeted Debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-tests:
    runs-on: windows-2022
    timeout-minutes: 30

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      QT_QPA_PLATFORM: "offscreen"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          architecture: "x64"
          cache: "pip"

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m ensurepip --upgrade
          python -m pip install --require-hashes -r requirements-bootstrap.txt
          python -m pip install --require-hashes --no-build-isolation -r requirements-runtime.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-openai.lock
          python -m pip install --require-hashes -r requirements-dev-windows-x64.lock

      - name: Run final seven tests
        shell: pwsh
        run: |
          python -m pytest `
            tests/test_encrypted_telethon_session.py::test_runtime_clients_receive_encrypted_session_instance `
            tests/test_v27_local_ban_runtime_fix.py::test_ambiguous_join_bans_only_target_and_batch_continues `
            tests/test_v27_local_ban_runtime_fix.py::test_resumed_checkpoint_skips_already_banned_channel_without_rpc `
            tests/test_v4715_repeat_audit_fixes.py::test_successful_scheduler_tick_clears_previous_failure_counter `
            tests/test_v4718_state_consistency_fixes.py::test_account_actions_remain_locked_until_identity_is_persisted `
            tests/test_v4721_business_logic_audit3.py::test_comment_task_never_runs_through_another_account_session `
            tests/test_v4721_business_logic_audit3.py::test_join_task_never_runs_through_another_account_session `
            -vv -s `
            -o addopts="" `
            --tb=long `
            --showlocals `
            --maxfail=0 `
            --junitxml=targeted-results.xml `
            2>&1 | Tee-Object -FilePath targeted-tests.log

          exit $LASTEXITCODE

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-targeted-debug-${{ github.sha }}
          path: |
            targeted-tests.log
            targeted-results.xml
          if-no-files-found: error
