name: Windows Release Proof

on:
  workflow_call:
    inputs:
      skip_source_tests:
        description: Reuse source/test proof from the calling Windows CI
        required: false
        type: boolean
        default: false
      continue_after_failures:
        description: Continue release diagnostics after an earlier failure
        required: false
        type: boolean
        default: false
      upstream_source_proof_passed:
        description: Whether caller source proof was green
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      skip_source_tests:
        description: Skip source tests only with an already-passed upstream proof
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-release-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-windows-release:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'dependabot/github_actions/') }}
    name: Build and prove Windows x64
    runs-on: windows-2022
    timeout-minutes: 120

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Configure byte-preserving Git checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.safecrlf true

      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: |
            requirements-bootstrap.txt
            requirements-runtime.lock
            requirements-openai.lock
            requirements-build-windows-x64.lock
            requirements-dev-windows-x64.lock

      - name: Record runner and source proof
        id: runner_proof
        continue-on-error: ${{ inputs.continue_after_failures }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $head = (git rev-parse HEAD).Trim()
          if ($head -ne "${{ github.sha }}") {
            throw "Checked out commit $head does not match requested commit ${{ github.sha }}."
          }

          $dirtyCheckout = @(git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect the checkout state."
          }
          if ($dirtyCheckout.Count -gt 0) {
            Write-Host "Unexpected checkout changes:"
            $dirtyCheckout | ForEach-Object { Write-Host "  $_" }
            throw "Checkout is not clean before the proof run."
          }

          New-Item -ItemType Directory -Path "dist\ci-proof" -Force | Out-Null

          @(
            "repository=${{ github.repository }}"
            "commit=${{ github.sha }}"
            "ref=${{ github.ref }}"
            "runner_os=${{ runner.os }}"
            "runner_arch=${{ runner.arch }}"
            "os_version=$([Environment]::OSVersion.VersionString)"
            "is_64_bit_os=$([Environment]::Is64BitOperatingSystem)"
            "powershell=$($PSVersionTable.PSVersion)"
          ) | Set-Content -LiteralPath "dist\ci-proof\runner.txt" -Encoding UTF8

          python -c "import platform,struct,sys; print(sys.version); print(sys.executable); print(platform.platform()); assert struct.calcsize('P') * 8 == 64" |
            Tee-Object -FilePath "dist\ci-proof\python-setup.txt"

          py -0p 2>&1 | Tee-Object -FilePath "dist\ci-proof\python-launcher-inventory.txt"
          if ($LASTEXITCODE -ne 0) {
            throw "Python Launcher inventory failed."
          }

          py -3.13-64 -c "import struct,sys; print(sys.version); print(sys.executable); assert sys.version_info[:2] == (3,13); assert struct.calcsize('P') * 8 == 64" |
            Tee-Object -FilePath "dist\ci-proof\python-313-proof.txt"
          if ($LASTEXITCODE -ne 0) {
            throw "Python 3.13 x64 is not available through py.exe."
          }

          $manifestOutput = @(python tools/generate_manifest.py --check 2>&1)
          $manifestExit = $LASTEXITCODE
          $manifestOutput | Tee-Object -FilePath "dist\ci-proof\manifest-before-build.txt"
          if ($manifestExit -ne 0) {
            Copy-Item -LiteralPath "SHA256SUMS.txt" `
              -Destination "dist\ci-proof\SHA256SUMS.expected.txt" -Force
            python tools/generate_manifest.py `
              --output "dist\ci-proof\SHA256SUMS.actual.txt" 2>&1 |
              Tee-Object -FilePath "dist\ci-proof\manifest-regeneration.txt"
            throw "Source manifest validation failed. Expected and actual manifests were saved without modifying the checkout."
          }

      - name: Run complete Windows release pipeline
        id: windows_build
        continue-on-error: ${{ inputs.continue_after_failures }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $buildArgs = @(
            "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass",
            "-File", ".\build\build_windows_x64.ps1"
          )
          if ("${{ inputs.skip_source_tests }}" -eq "true") {
            $buildArgs += "-SkipTests"
            if ("${{ inputs.upstream_source_proof_passed }}" -eq "true") {
              Write-Host "Reusing passed upstream Python 3.13/3.14 source/test proof."
            }
            else {
              Write-Host "Upstream source proof is red; continuing packaging diagnostics."
            }
          }
          python tools/run_ci_subprocess.py `
            --label windows-release `
            --log "dist\ci-proof\build.log" `
            --idle-timeout-seconds 900 `
            --total-timeout-seconds 6600 `
            -- `
            powershell.exe @buildArgs
          $buildExit = $LASTEXITCODE

          if ($buildExit -ne 0) {
            throw "Windows release build failed with exit code $buildExit."
          }

      - name: Verify release evidence
        id: verify_release
        continue-on-error: ${{ inputs.continue_after_failures }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zip = Get-ChildItem -LiteralPath "dist" -File -Filter "*-Windows-x64.zip" |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          $checksums = Get-ChildItem -LiteralPath "dist" -File -Filter "*-Windows-x64-SHA256SUMS.txt" |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          $sbom = Get-ChildItem -LiteralPath "dist" -File -Filter "*-Windows-x64-SBOM.cdx.json" |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1

          if ($null -eq $zip) { throw "Release ZIP was not produced." }
          if ($null -eq $checksums) { throw "Release checksum file was not produced." }
          if ($null -eq $sbom) { throw "Release SBOM was not produced." }
          $reusedSourceProof = "${{ inputs.skip_source_tests }}" -eq "true"
          if ($reusedSourceProof) {
            $sourceProofPassed = "${{ inputs.upstream_source_proof_passed }}" -eq "true"
            $coverageEvidence = if ($sourceProofPassed) { "upstream: passed Python 3.13 + Python 3.14 source proofs" } else { "upstream: source proof artifacts contain failures; packaging continued diagnostically" }
            @(
              "reused=true"
              "passed=$sourceProofPassed"
              "commit=${{ github.sha }}"
              "source=calling Windows CI source-proof matrix"
            ) | Set-Content -LiteralPath "dist\ci-proof\upstream-source-proof.txt" -Encoding UTF8
          }
          else {
            if (-not (Test-Path -LiteralPath "dist\ci-proof\coverage.json" -PathType Leaf)) {
              throw "dist\ci-proof\coverage.json was not produced."
            }
            $coverageEvidence = "dist/ci-proof/coverage.json"
          }

          $checksumLine = (Get-Content -LiteralPath $checksums.FullName -Raw).Trim()
          $expectedHash = ($checksumLine -split "\s+", 2)[0].ToLowerInvariant()
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip.FullName).Hash.ToLowerInvariant()
          if ($expectedHash -ne $actualHash) {
            throw "Release ZIP checksum mismatch."
          }

          $sbomDocument = Get-Content -LiteralPath $sbom.FullName -Raw | ConvertFrom-Json
          $components = @($sbomDocument.components)
          if ($components.Count -lt 10) {
            throw "SBOM is unexpectedly incomplete: $($components.Count) components."
          }
          if (-not ($components | Where-Object { $_.name -eq "openai" })) {
            throw "SBOM does not contain the OpenAI SDK."
          }

          @(
            "zip=$($zip.Name)"
            "zip_sha256=$actualHash"
            "zip_bytes=$($zip.Length)"
            "checksums=$($checksums.Name)"
            "sbom=$($sbom.Name)"
            "sbom_components=$($components.Count)"
            "coverage=$coverageEvidence"
            "source_proof_reused=$reusedSourceProof"
          ) | Set-Content -LiteralPath "dist\ci-proof\release-evidence.txt" -Encoding UTF8

          @"
          ## Windows release proof passed

          - Commit: `${{ github.sha }}`
          - Runner: Windows Server 2022 x64
          - Release ZIP: `$($zip.Name)`
          - ZIP SHA-256: `$actualHash`
          - SBOM components: `$($components.Count)`
          - Source proof: `$coverageEvidence`
          - Python 3.13/3.14 source gates and coverage were completed upstream when reuse is enabled; SQLCipher, PyInstaller and packaged self-tests were completed in this release job.
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8

      - name: Upload verified release
        if: ${{ steps.runner_proof.outcome == 'success' && steps.windows_build.outcome == 'success' && steps.verify_release.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LansetSpBot-Windows-x64-${{ github.sha }}
          path: |
            dist/*-Windows-x64.zip
            dist/*-Windows-x64-SHA256SUMS.txt
            dist/*-Windows-x64-SBOM.cdx.json
            dist/ci-proof/coverage.json
            dist/ci-proof/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload failure evidence
        if: ${{ always() && (failure() || cancelled() || steps.runner_proof.outcome == 'failure' || steps.windows_build.outcome == 'failure' || steps.verify_release.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LansetSpBot-Windows-failure-${{ github.sha }}
          path: |
            dist/ci-proof/**
            dist/*-Windows-x64.zip
            dist/*-Windows-x64-SHA256SUMS.txt
            dist/*-Windows-x64-SBOM.cdx.json
            SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Fail after complete diagnostic pipeline
        if: ${{ always() && inputs.continue_after_failures && (steps.runner_proof.outcome == 'failure' || steps.windows_build.outcome == 'failure' || steps.verify_release.outcome == 'failure') }}
        shell: pwsh
        run: |
          throw "One or more release diagnostic stages failed. All configured stages were allowed to run; inspect uploaded evidence."

  prove-python-314-source:
    if: ${{ !inputs.skip_source_tests && (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'dependabot/github_actions/')) }}
    name: Prove Python 3.14 x64 source runtime
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      QT_QPA_PLATFORM: "offscreen"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Configure byte-preserving Git checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.safecrlf true

      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.14 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: |
            requirements-bootstrap.txt
            requirements-runtime.lock
            requirements-openai.lock
            requirements-dev-windows-x64.lock

      - name: Install hash-locked source and test dependencies
        shell: pwsh
        run: |
          python -m ensurepip --upgrade
          python -m pip install --require-hashes -r requirements-bootstrap.txt
          python -m pip install --require-hashes --no-build-isolation -r requirements-runtime.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-openai.lock
          python -m pip install --require-hashes -r requirements-dev-windows-x64.lock

      - name: Run complete Python 3.14 source proof
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File ".\tools\run_windows_source_ci.ps1" `
            -PythonVersion "3.14" `
            -EvidenceRoot "dist\ci-proof-314"
          if ($LASTEXITCODE -ne 0) {
            throw "Python 3.14 source proof failed."
          }

      - name: Upload Python 3.14 source proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LansetSpBot-Python-3.14-source-${{ github.sha }}
          path: dist/ci-proof-314/**
          if-no-files-found: error
          retention-days: 14
