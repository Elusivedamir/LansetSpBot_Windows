name: Windows Signed Release Proof

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  sign-prove-attest:
    runs-on: windows-2022
    timeout-minutes: 120
    environment: release-signing
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Configure byte-preserving Git checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.safecrlf true

      - name: Checkout exact tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: |
            requirements-bootstrap.txt
            requirements-runtime.lock
            requirements-openai.lock
            requirements-build-windows-x64.lock
            requirements-dev-windows-x64.lock

      - name: Materialize signing certificate in runner temp
        shell: pwsh
        env:
          SIGNING_PFX_B64: ${{ secrets.WINDOWS_SIGNING_PFX_B64 }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:SIGNING_PFX_B64) { throw "Signing PFX secret is missing." }
          $path = Join-Path $env:RUNNER_TEMP "lansetspbot-signing.pfx"
          [System.IO.File]::WriteAllBytes(
            $path,
            [Convert]::FromBase64String($env:SIGNING_PFX_B64)
          )
          "SIGNING_PFX_PATH=$path" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Build, sign and prove exact tagged source
        shell: pwsh
        env:
          LANSETSPBOT_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Path "dist\ci-proof" -Force | Out-Null
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File ".\build\build_windows_x64.ps1" `
            -SigningPfxPath $env:SIGNING_PFX_PATH 2>&1 |
            Tee-Object -FilePath "dist\ci-proof\signed-release-build.log"
          exit $LASTEXITCODE

      - name: Verify signed proof contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $proof = Get-Content -LiteralPath "dist\ci-proof\release-proof.json" -Raw |
            ConvertFrom-Json
          if ($proof.commit -ne "${{ github.sha }}") {
            throw "Release proof commit does not match the tagged commit."
          }
          if (-not $proof.gates.authenticode_signed) {
            throw "Release proof does not confirm Authenticode signing."
          }

      - name: Attest signed ZIP and SBOM
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*-Windows-x64.zip
            dist/*-Windows-x64-SBOM.cdx.json

      - name: Upload signed release proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LansetSpBot-signed-${{ github.sha }}
          path: |
            dist/*-Windows-x64.zip
            dist/*-Windows-x64-SHA256SUMS.txt
            dist/*-Windows-x64-SBOM.cdx.json
            dist/ci-proof/**
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary certificate file
        if: always()
        shell: pwsh
        run: |
          if ($env:SIGNING_PFX_PATH) {
            Remove-Item -LiteralPath $env:SIGNING_PFX_PATH -Force -ErrorAction SilentlyContinue
          }
