name: Windows Signed Release Proof

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Audit exact tagged dependency locks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit every shipped lock with OSV
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: >-
            requirements-runtime.lock
            requirements-openai.lock
            requirements-build-windows-x64.lock
            requirements-dev-windows-x64.lock
          require-hashes: true
          no-deps: true
          disable-pip: true
          vulnerability-service: osv
          summary: false
          internal-be-careful-allow-failure: true
          internal-be-careful-extra-flags: >-
            --format=json
            --output=dependency-audit.json

      - name: Enforce fail-closed vulnerability policy
        run: python tools/enforce_dependency_audit_policy.py dependency-audit.json

      - name: Upload exact-SHA dependency evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dependency-audit-${{ github.sha }}
          path: dependency-audit.json
          if-no-files-found: error
          retention-days: 30

  sign-prove-attest:
    needs: dependency-audit
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 120
    environment: release-signing
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Configure byte-preserving Git checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.safecrlf true

      - name: Checkout exact tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: |
            requirements-bootstrap.txt
            requirements-runtime.lock
            requirements-openai.lock
            requirements-build-windows-x64.lock
            requirements-dev-windows-x64.lock

      - name: Materialize signing certificate in runner temp
        shell: pwsh
        env:
          SIGNING_PFX_B64: ${{ secrets.WINDOWS_SIGNING_PFX_B64 }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:SIGNING_PFX_B64) { throw "Signing PFX secret is missing." }
          $path = Join-Path $env:RUNNER_TEMP "lansetspbot-signing.pfx"
          [System.IO.File]::WriteAllBytes(
            $path,
            [Convert]::FromBase64String($env:SIGNING_PFX_B64)
          )
          "SIGNING_PFX_PATH=$path" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Build, sign and prove exact tagged source
        shell: pwsh
        env:
          LANSETSPBOT_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Path "dist\ci-proof" -Force | Out-Null
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File ".\build\build_windows_x64.ps1" `
            -SigningPfxPath $env:SIGNING_PFX_PATH 2>&1 |
            Tee-Object -FilePath "dist\ci-proof\signed-release-build.log"
          exit $LASTEXITCODE

      - name: Verify signed proof contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $proof = Get-Content -LiteralPath "dist\ci-proof\release-proof.json" -Raw |
            ConvertFrom-Json
          if ($proof.commit -ne "${{ github.sha }}") {
            throw "Release proof commit does not match the tagged commit."
          }
          if (-not $proof.gates.authenticode_signed) {
            throw "Release proof does not confirm Authenticode signing."
          }

      - name: Download exact-SHA dependency audit evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dependency-audit-${{ github.sha }}
          path: dist/ci-proof/dependency-audit

      - name: Verify dependency audit evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $auditPath = "dist\ci-proof\dependency-audit\dependency-audit.json"
          if (-not (Test-Path -LiteralPath $auditPath -PathType Leaf)) {
            throw "Exact-SHA dependency audit report is missing."
          }
          Get-Content -LiteralPath $auditPath -Raw |
            ConvertFrom-Json | Out-Null
          @(
            "commit=${{ github.sha }}"
            "report=$auditPath"
            "sha256=$((Get-FileHash -Algorithm SHA256 -LiteralPath $auditPath).Hash.ToLowerInvariant())"
          ) | Set-Content `
            -LiteralPath "dist\ci-proof\dependency-audit-proof.txt" `
            -Encoding UTF8

      - name: Attest signed ZIP and SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*-Windows-x64.zip
            dist/*-Windows-x64-SBOM.cdx.json

      - name: Upload signed release proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LansetSpBot-signed-${{ github.sha }}
          path: |
            dist/*-Windows-x64.zip
            dist/*-Windows-x64-SHA256SUMS.txt
            dist/*-Windows-x64-SBOM.cdx.json
            dist/ci-proof/**
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary certificate file
        if: always()
        shell: pwsh
        run: |
          if ($env:SIGNING_PFX_PATH) {
            Remove-Item -LiteralPath $env:SIGNING_PFX_PATH -Force -ErrorAction SilentlyContinue
          }
